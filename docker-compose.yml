
services:
  orders-db:
    image: postgres:17
    container_name: order-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orders_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_user -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
      image: rabbitmq:4-management
      container_name: order-platform-rabbitmq
      restart: unless-stopped
      environment:
        RABBITMQ_DEFAULT_USER: app_user
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      ports:
        - "127.0.0.1:5672:5672"
        - "127.0.0.1:15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

volumes:
  orders_data:
  rabbitmq_data:
